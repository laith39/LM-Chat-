name: Build AI Chat APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Generate project
        run: |
          mkdir -p app/src/main/java/com/laith/aichat
          cat > settings.gradle.kts <<'EOT'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "AiChat"
          include(":app")
          EOT
          cat > build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOT
          cat > gradle.properties <<'EOT'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOT
          cat > app/build.gradle.kts <<'EOT'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.laith.aichat"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.laith.aichat"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 3
                  versionName = "1.2"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
          }
          EOT
          cat > app/src/main/AndroidManifest.xml <<'EOT'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <application
                  android:label="Gemini AI Chat"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOT
          cat > app/src/main/java/com/laith/aichat/MainActivity.kt <<'EOT'
          package com.laith.aichat

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Bundle
          import android.util.Base64
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.*
          import kotlinx.coroutines.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.net.HttpURLConnection
          import java.net.URL

          class MainActivity : Activity() {
              private lateinit var chatContainer: LinearLayout
              private lateinit var scrollContainer: ScrollView
              private lateinit var inputField: EditText
              private lateinit var previewRow: LinearLayout
              private lateinit var previewImage: ImageView
              private val scope = CoroutineScope(Dispatchers.Main + Job())

              private val prefs by lazy { getSharedPreferences("aichat", MODE_PRIVATE) }
              private var apiKey: String
                  get() = prefs.getString("api_key", "") ?: ""
                  set(v) { prefs.edit().putString("api_key", v.trim()).apply() }
              private var modelName: String
                  get() = prefs.getString("model", "gemini-3.5-flash") ?: "gemini-3.5-flash"
                  set(v) { prefs.edit().putString("model", v.trim()).apply() }

              private var pendingImage: Bitmap? = null
              private var busy = false
              private val PICK_IMAGE = 101

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.decorView.setBackgroundColor(Color.parseColor("#0B0F19"))

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)
                  }

                  // الشريط العلوي
                  val topBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(16), dp(10), dp(8), dp(10))
                      setBackgroundColor(Color.parseColor("#151C2C"))
                  }
                  val title = TextView(this).apply {
                      text = "Gemini AI Chat"
                      setTextColor(Color.WHITE)
                      textSize = 17f
                      setTypeface(typeface, Typeface.BOLD)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  val gear = TextView(this).apply {
                      text = "⚙️"
                      textSize = 22f
                      gravity = Gravity.CENTER
                      setPadding(dp(12), dp(4), dp(12), dp(4))
                      setOnClickListener { showSettings() }
                  }
                  topBar.addView(title)
                  topBar.addView(gear)
                  root.addView(topBar)

                  chatContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(8), dp(8), dp(8), dp(8))
                  }

                  scrollContainer = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f)
                      addView(chatContainer)
                  }
                  root.addView(scrollContainer)

                  previewRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(12), dp(8), dp(12), dp(8))
                      setBackgroundColor(Color.parseColor("#111827"))
                      visibility = View.GONE
                  }
                  previewImage = ImageView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(64), dp(64))
                      scaleType = ImageView.ScaleType.CENTER_CROP
                  }
                  previewRow.addView(previewImage)
                  val previewLabel = TextView(this).apply {
                      text = "صورة مرفقة"
                      setTextColor(Color.parseColor("#94A3B8"))
                      textSize = 13f
                      setPadding(dp(12), 0, dp(12), 0)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  previewRow.addView(previewLabel)
                  val removeBtn = TextView(this).apply {
                      text = "✕"
                      setTextColor(Color.WHITE)
                      textSize = 18f
                      gravity = Gravity.CENTER
                      setPadding(dp(14), dp(8), dp(14), dp(8))
                      setOnClickListener { clearPending() }
                  }
                  previewRow.addView(removeBtn)
                  root.addView(previewRow)

                  val bottomBar = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(dp(10), dp(10), dp(10), dp(10))
                      setBackgroundColor(Color.parseColor("#151C2C"))
                      gravity = Gravity.CENTER_VERTICAL
                  }

                  val attachBtn = TextView(this).apply {
                      text = "📎"
                      textSize = 22f
                      gravity = Gravity.CENTER
                      setPadding(dp(10), dp(6), dp(10), dp(6))
                      setOnClickListener { pickImage() }
                  }
                  bottomBar.addView(attachBtn)

                  inputField = EditText(this).apply {
                      hint = "اكتب رسالتك هنا..."
                      setTextColor(Color.WHITE)
                      setHintTextColor(Color.parseColor("#64748B"))
                      textSize = 15f
                      setBackgroundColor(Color.TRANSPARENT)
                      setPadding(dp(8), dp(8), dp(8), dp(8))
                      maxLines = 5
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
                  }
                  bottomBar.addView(inputField)

                  val sendBtn = Button(this).apply {
                      text = "إرسال"
                      setTextColor(Color.WHITE)
                      textSize = 14f
                      isAllCaps = false
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#007BFF"))
                          cornerRadius = dp(12).toFloat()
                      }
                      setPadding(dp(16), dp(8), dp(16), dp(8))
                      setOnClickListener { sendMessage() }
                  }
                  bottomBar.addView(sendBtn)
                  root.addView(bottomBar)

                  setContentView(root)
                  addMessage("أهلاً بك! اكتب رسالتك، أو اضغط 📎 لإرفاق صورة وتحليلها.", false, null)

                  if (apiKey.isBlank()) {
                      addMessage("أدخل مفتاح API من زر ⚙️ بالأعلى للبدء.", false, null)
                      root.post { showSettings() }
                  }
              }

              // ---------- الإعدادات ----------

              private fun showSettings() {
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(12), dp(20), 0)
                  }
                  val keyInput = EditText(this).apply {
                      hint = "مفتاح API"
                      setText(apiKey)
                      setSingleLine(true)
                  }
                  val modelInput = EditText(this).apply {
                      hint = "اسم الموديل"
                      setText(modelName)
                      setSingleLine(true)
                  }
                  box.addView(keyInput)
                  box.addView(modelInput)

                  AlertDialog.Builder(this, AlertDialog.THEME_DEVICE_DEFAULT_DARK)
                      .setTitle("الإعدادات")
                      .setView(box)
                      .setPositiveButton("حفظ") { _, _ ->
                          apiKey = keyInput.text.toString()
                          val m = modelInput.text.toString()
                          modelName = if (m.isBlank()) "gemini-3.5-flash" else m
                          Toast.makeText(this, "تم الحفظ", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("إلغاء", null)
                      .show()
              }

              // ---------- الصور ----------

              private fun pickImage() {
                  val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                      type = "image/*"
                      addCategory(Intent.CATEGORY_OPENABLE)
                  }
                  startActivityForResult(Intent.createChooser(intent, "اختر صورة"), PICK_IMAGE)
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == PICK_IMAGE && resultCode == RESULT_OK) {
                      val uri = data?.data ?: return
                      val bmp = try { loadBitmap(uri) } catch (e: Exception) { null }
                      if (bmp == null) {
                          Toast.makeText(this, "تعذر قراءة الصورة", Toast.LENGTH_SHORT).show()
                          return
                      }
                      pendingImage = bmp
                      previewImage.setImageBitmap(bmp)
                      previewRow.visibility = View.VISIBLE
                  }
              }

              private fun clearPending() {
                  pendingImage = null
                  previewRow.visibility = View.GONE
              }

              private fun loadBitmap(uri: Uri): Bitmap? {
                  val bytes = contentResolver.openInputStream(uri)?.use { it.readBytes() } ?: return null
                  val bounds = BitmapFactory.Options().apply { inJustDecodeBounds = true }
                  BitmapFactory.decodeByteArray(bytes, 0, bytes.size, bounds)
                  var sample = 1
                  while (bounds.outWidth / sample > 2048 || bounds.outHeight / sample > 2048) sample *= 2
                  val opts = BitmapFactory.Options().apply { inSampleSize = sample }
                  val bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size, opts) ?: return null
                  val maxSide = 1280
                  val scale = minOf(1f, maxSide.toFloat() / maxOf(bmp.width, bmp.height))
                  return if (scale < 1f)
                      Bitmap.createScaledBitmap(bmp, (bmp.width * scale).toInt(), (bmp.height * scale).toInt(), true)
                  else bmp
              }

              private fun bitmapToBase64(bmp: Bitmap): String {
                  val out = ByteArrayOutputStream()
                  bmp.compress(Bitmap.CompressFormat.JPEG, 85, out)
                  return Base64.encodeToString(out.toByteArray(), Base64.NO_WRAP)
              }

              // ---------- الإرسال ----------

              private fun sendMessage() {
                  if (busy) return
                  val key = apiKey
                  if (key.isBlank()) {
                      showSettings()
                      return
                  }
                  val model = modelName
                  val typed = inputField.text.toString().trim()
                  val image = pendingImage
                  if (typed.isEmpty() && image == null) return

                  val prompt = if (typed.isEmpty()) "حلل هذه الصورة وصف ما فيها بالتفصيل." else typed

                  addMessage(if (typed.isEmpty()) "📷 (صورة)" else typed, true, image)
                  inputField.text.clear()
                  clearPending()

                  busy = true
                  val loadingId = addMessage("جاري التفكير...", false, null)

                  scope.launch(Dispatchers.IO) {
                      var conn: HttpURLConnection? = null
                      try {
                          val parts = JSONArray()
                          if (image != null) {
                              parts.put(JSONObject().put("inline_data", JSONObject().apply {
                                  put("mime_type", "image/jpeg")
                                  put("data", bitmapToBase64(image))
                              }))
                          }
                          parts.put(JSONObject().put("text", prompt))

                          val jsonBody = JSONObject().put(
                              "contents",
                              JSONArray().put(JSONObject().put("parts", parts))
                          )

                          val url = URL("https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent")
                          conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"
                          conn.connectTimeout = 30000
                          conn.readTimeout = 90000
                          conn.setRequestProperty("Content-Type", "application/json")
                          conn.setRequestProperty("x-goog-api-key", key)
                          conn.doOutput = true
                          conn.outputStream.use { it.write(jsonBody.toString().toByteArray(Charsets.UTF_8)) }

                          val code = conn.responseCode
                          if (code == 200) {
                              val respStr = conn.inputStream.bufferedReader().readText()
                              val reply = extractReply(respStr)
                              withContext(Dispatchers.Main) {
                                  removeMessage(loadingId)
                                  addMessage(reply, false, null)
                              }
                          } else {
                              val err = conn.errorStream?.bufferedReader()?.readText() ?: ""
                              withContext(Dispatchers.Main) {
                                  removeMessage(loadingId)
                                  addMessage("خطأ ($code): $err", false, null)
                              }
                          }
                      } catch (e: Exception) {
                          withContext(Dispatchers.Main) {
                              removeMessage(loadingId)
                              addMessage("فشل الاتصال: ${e.localizedMessage}", false, null)
                          }
                      } finally {
                          conn?.disconnect()
                          withContext(Dispatchers.Main) { busy = false }
                      }
                  }
              }

              private fun extractReply(json: String): String {
                  val resp = JSONObject(json)
                  val candidates = resp.optJSONArray("candidates")
                  if (candidates == null || candidates.length() == 0) {
                      val reason = resp.optJSONObject("promptFeedback")?.optString("blockReason") ?: ""
                      return "لم يصل رد من النموذج. $reason"
                  }
                  val partsArr = candidates.getJSONObject(0).optJSONObject("content")?.optJSONArray("parts")
                      ?: return "رد فارغ من النموذج."
                  val sb = StringBuilder()
                  for (i in 0 until partsArr.length()) {
                      sb.append(partsArr.getJSONObject(i).optString("text", ""))
                  }
                  return sb.toString().ifBlank { "رد فارغ من النموذج." }
              }

              // ---------- الواجهة ----------

              private var msgCounter = 0
              private fun addMessage(text: String, isUser: Boolean, image: Bitmap?): Int {
                  val id = msgCounter++
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, dp(5), 0, dp(5))
                      tag = id
                  }
                  val lp = { LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                      gravity = if (isUser) Gravity.END else Gravity.START
                  } }

                  if (image != null) {
                      val iv = ImageView(this).apply {
                          setImageBitmap(image)
                          adjustViewBounds = true
                          maxWidth = dp(220)
                          maxHeight = dp(220)
                          scaleType = ImageView.ScaleType.FIT_CENTER
                          layoutParams = lp().apply { bottomMargin = dp(4) }
                      }
                      container.addView(iv)
                  }

                  val bubble = TextView(this).apply {
                      this.text = text
                      textSize = 15f
                      setTextColor(Color.WHITE)
                      setTextIsSelectable(true)
                      setPadding(dp(12), dp(10), dp(12), dp(10))
                      background = GradientDrawable().apply {
                          setColor(if (isUser) Color.parseColor("#007BFF") else Color.parseColor("#1E293B"))
                          cornerRadius = dp(14).toFloat()
                      }
                      maxWidth = (resources.displayMetrics.widthPixels * 0.85).toInt()
                      layoutParams = lp()
                  }
                  container.addView(bubble)
                  chatContainer.addView(container)

                  scrollContainer.post { scrollContainer.fullScroll(ScrollView.FOCUS_DOWN) }
                  return id
              }

              private fun removeMessage(id: Int) {
                  val view = chatContainer.findViewWithTag<View>(id)
                  if (view != null) chatContainer.removeView(view)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  scope.cancel()
              }
          }
          EOT
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AiChat-APK
          path: app/build/outputs/apk/debug/app-debug.apk
